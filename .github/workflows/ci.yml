name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run validate:companies

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run setup:jobs
      - name: Seed example intelligence and profile
        run: |
          mkdir -p data/intelligence data/jobs data/profile
          cp data/examples/candidate-intelligence.example.json data/intelligence/candidate-intelligence.json
          cp data/examples/candidate-profile.example.json data/profile/candidate-profile.json
      - run: npm test
      - run: npm run discover:jobs:mock
      - run: npm run score:jobs
